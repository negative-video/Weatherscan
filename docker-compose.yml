services:
  weatherscan:
    build:
      context: .
      dockerfile: Dockerfile
    image: weatherscan:latest
    container_name: weatherscan
    restart: unless-stopped

    # Every setting lives in .env — copy .env.example and edit.
    env_file:
      - .env

    ports:
      - "${HTTP_PORT:-8080}:8080"

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # The whole app is a static server plus a small JSON cache; it does not need
    # much, and capping it keeps a runaway from taking the host down.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true

    # Nothing is written to disk at runtime.
    read_only: true
    tmpfs:
      - /tmp
